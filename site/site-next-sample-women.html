/* the page: a full-bleed site header, the content column, the tagline ticker, then room for the sticky purchase bar */
#sample-app{padding-bottom:180px}
.sample-shell{max-width:1120px;margin:auto;padding:0 20px 36px}
/* ---- site header: a copy of the homepage header. Values are the homepage's computed styles (app/globals.css .site-header /
   .brand / .brand-logo-image, app/preview.css .preview-home, app/refresh.css .nav-cta, app/shine.css .ring-shine): same bar,
   same padding, same border, same logo file, mask, size rule and drawn ring, same pill CTA with the blue-and-rose outline light. ---- */
.site-header{position:relative;z-index:20;display:grid;grid-template-columns:1fr auto;align-items:center;width:100%;min-height:88px;padding:0 32px;padding-top:env(safe-area-inset-top,0px);background:#101311;color:#f5f4ef;border-bottom:1px solid rgba(255,255,255,.2);font-family:Archivo,Arial,Helvetica,sans-serif}

.brand:after{content:"";position:absolute;top:18.8%;left:8.05%;width:20.8%;aspect-ratio:1;border:1px solid #f4f4f0;border-radius:50%;pointer-events:none}
.site-nav{display:flex;align-items:center;gap:30px;justify-self:end}

.back-row{display:none}
.nav-cta{display:flex;align-items:center;gap:16px;padding:10px 18px;border:1px solid rgba(220,235,224,.45);border-radius:999px;background:transparent;color:#f5f4ef;font-size:.95rem;font-weight:600;line-height:1.5;text-transform:none;letter-spacing:0;white-space:nowrap;flex:none;transition:background-color .2s ease,color .2s ease}
.nav-cta:hover{background:#dcebe0;color:#0a0f0c}
.site-header a:focus-visible,.back-row a:focus-visible{outline-color:#dcebe0}
/* outline light of "Join the Training Club" (app/shine.css .ring-shine): blue-and-rose light runs the outline plus a sheen sweep, 3 s cycle */
@property --ring-shine-angle{syntax:"<angle>";inherits:false;initial-value:0deg}
.ring-shine{position:relative;isolation:isolate;overflow:visible}

.ring-shine::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;overflow:hidden;background:linear-gradient(115deg,transparent 30%,rgb(255 255 255 / .55) 48%,rgb(255 210 230 / .45) 52%,transparent 66%);background-size:250% 100%;background-position:120% 0;mix-blend-mode:screen}
@keyframes ring-shine-spin{to{--ring-shine-angle:360deg}}
@keyframes ring-shine-sheen{0%,55%{background-position:120% 0}100%{background-position:-30% 0}}
@media (prefers-reduced-motion:no-preference){.ring-shine::before{animation:ring-shine-spin 3s linear infinite}.ring-shine::after{animation:ring-shine-sheen 3s ease-in-out infinite}}

/* ---- tagline ticker: the homepage's .results-slider (app/ticker.css values, unscoped). Pauses on hover, static under reduced motion. ---- */
.results-slider{width:100%;overflow:hidden;padding:22px 0;border:0;background:#dcebe0;color:#161716}

@keyframes ticker-slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(max-width:640px){.results-slider{padding:16px 0}}
.icon svg,.back svg,.join svg,.guide summary svg{width:18px;height:18px;display:block;flex:none}

.programs button[data-program=men]:before{padding:2.5px;background:conic-gradient(from var(--ring-angle),rgba(90,174,255,.22) 0 220deg,rgba(110,185,255,.9) 290deg,#f2f9ff 328deg,#fff 338deg,rgba(120,190,255,.95) 348deg,rgba(90,174,255,.22) 360deg);filter:drop-shadow(0 0 6px rgba(90,174,255,.95)) drop-shadow(0 0 14px rgba(90,174,255,.5))}
.programs button[data-program=women]:before{background:conic-gradient(from var(--ring-angle),rgba(255,125,175,.2) 0 220deg,rgba(255,140,185,.85) 290deg,#fff3f8 328deg,rgba(255,140,185,.85) 345deg,rgba(255,125,175,.2) 360deg);filter:drop-shadow(0 0 6px rgba(255,120,170,.95))}
@keyframes ring-spin{to{--ring-angle:360deg}}
@media (prefers-reduced-motion:no-preference){.programs button:before{animation:ring-spin 3s linear infinite}}
.intro{padding:24px 0 20px}.intro p{margin:0 0 6px;color:var(--muted);font-size:12.5px}
.intro h1{font-family:var(--display);font-weight:var(--display-weight);font-size:32px;line-height:1.1;margin:0;font-variation-settings:"wdth" 108;text-wrap:balance}
:root[data-program=women] .intro h1{font-size:36px;font-variation-settings:normal;letter-spacing:-.01em}
.intro .lede{margin:10px 0 0;color:var(--text-2);font-size:14px}
.exercises{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.exercise{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;box-shadow:0 18px 40px -28px rgba(0,0,0,.9)}
.exercise header{padding:18px 20px 12px;min-height:92px}.exercise h2{margin:0;font-family:var(--display);font-size:20px;line-height:1.22;font-weight:var(--display-weight)}.muscles{margin:6px 0 0;font-size:12.5px;color:var(--flame)}
.stage{height:380px;background:radial-gradient(115% 85% at 55% 22%,var(--stage-a) 0%,var(--stage-b) 64%);position:relative;overflow:hidden;contain:layout paint}
.stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:9%;background:linear-gradient(180deg,rgba(0,0,0,0),var(--floor));pointer-events:none}
.stage>svg{position:relative;z-index:1;width:100%;height:100%;display:block}
.motion-bar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface-2)}
.icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
.motion-bar input{width:100%;min-width:0;height:44px;accent-color:var(--flame)}
.rep-steps{list-style:none;margin:0;padding:12px 20px 4px;display:grid;gap:4px;border-bottom:1px solid var(--line)}
.rep-steps li{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-radius:8px;color:var(--muted);font-size:13px;line-height:1.35;transition:background-color .25s ease,color .25s ease}
.rep-steps li b{color:var(--text-2);font-weight:700}
.rep-steps .n{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:inline-grid;place-items:center;font:700 10px var(--mono);color:var(--muted);transform:translateY(2px);transition:all .25s ease}
.rep-steps li.on{background:var(--flame-soft);color:var(--text)}
.rep-steps li.on b{color:var(--flame)}
.rep-steps li.on .n{background:var(--flame);border-color:var(--flame);color:var(--done-ink)}
.prescription{display:grid;grid-template-columns:.8fr 1.6fr 1fr;gap:10px;padding:14px 20px}.prescription span{display:block;font-size:10px;color:var(--muted)}.prescription strong{font:700 15px var(--mono);display:block;margin-top:3px;overflow-wrap:anywhere}
.cue{margin:0 20px;padding:12px 0;border-block:1px solid var(--line);color:var(--text-2);font-size:13.5px;line-height:1.5;min-height:65px}.cue b{color:var(--flame);font-size:11px;display:block;margin-bottom:4px}
.logging{padding:14px 20px}.log-title{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11.5px;margin-bottom:8px}.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{min-width:64px;height:54px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);display:grid;align-content:center;justify-items:center;gap:2px;transition:background-color .15s ease,border-color .15s ease}
.set .set-n{font:700 14px var(--mono);line-height:1}.set .set-v{font:600 11px var(--mono);color:var(--text-2);line-height:1}.set .set-v.muted{color:var(--muted);font-weight:500}
.set.done{background:var(--done);border-color:var(--done);color:var(--done-ink)}.set.done .set-v{color:var(--done-ink)}.set.editing{border-color:var(--flame);box-shadow:0 0 0 2px var(--flame-soft)}
/* set editor: weight, reps and effort for the tapped set */
.set-editor{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);display:grid;gap:12px;animation:editor-in .25s ease}
@keyframes editor-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.field>span{display:block;font-size:10.5px;color:var(--muted);margin-bottom:6px}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.stepper button{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:20px;line-height:1}

.editor-actions{display:flex;gap:8px;align-items:center}
.log-set{flex:1;min-height:48px;border:0;border-radius:999px;background:var(--flame);color:var(--done-ink);font-size:14.5px;font-weight:800}
.clear-set{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-size:12.5px}
.totals{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}.totals b{color:var(--text);font-family:var(--mono);font-weight:700}.totals .best b{color:var(--flame)}.totals .muted{color:var(--muted)}
.last-time{margin:0 20px;padding:10px 0 0;font:12.5px var(--mono);color:var(--text-2)}.last-time b{display:block;font:700 10px var(--sans);color:var(--muted);margin-bottom:3px}

.follow{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);font-size:12.5px;font-weight:700;white-space:nowrap}.follow[aria-pressed=true]{background:var(--flame);border-color:var(--flame);color:var(--done-ink)}
.rep-counter{position:absolute;z-index:2;left:16px;top:14px;display:flex;align-items:baseline;gap:5px;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);color:var(--text)}

/* one click handler for every control in the sample */
root.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b||!root.contains(b))return;

  if(b.hasAttribute("data-follow")){var g=figures[+b.getAttribute("data-follow")];startFollow(g,!g.follow);return;}

    if(b.hasAttribute("data-step")){var inp=editor.querySelector('[data-field="'+b.getAttribute("data-step")+'"]'),v=Math.max(0,(+inp.value||0)+(+b.getAttribute("data-d")));inp.value=b.getAttribute("data-step")==="r" ? Math.round(v) : Math.round(v*2)/2;return;}

      if(!db.session) db.session={program:tk(),start:Date.now()};
      var key=tk()+"|"+item.slug,best=db.best[key],isBest=w>0 && (!best || w*r>best.vol || w>best.w);

function startFollow(f,on){
  f.follow=on;f.followBtn.setAttribute("aria-pressed",String(on));f.counter.hidden=!on;
  if(on){f.reps=0;f.loops=0;f.clock=0;f.paused=false;f.repEl.textContent="0";f.counter.classList.remove("complete");setControl(f);}
}
function markStep(f){if(f.step===f.api.step)return;f.step=f.api.step;for(var k=0;k<f.items.length;k++){var on=k===f.step;f.items[k].className=on?"on":"";if(on)f.items[k].setAttribute("aria-current","step");else f.items[k].removeAttribute("aria-current");}}
function setControl(f){f.button.innerHTML=icon(f.paused ? "play" : "pause");f.button.setAttribute("aria-label",(f.paused ? "Play " : "Pause ")+f.name);f.button.title=f.paused ? "Play movement" : "Pause movement";}
function drawRest(){
  var bar=document.getElementById("sample-rest");if(!bar)return;
  var remaining=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
  if(restEnd && !remaining){restEnd=0;restDoneUntil=Date.now()+6000;}
  var showDone=restDoneUntil>Date.now();
  bar.hidden=!remaining && !showDone;
  if(remaining){document.getElementById("rest-time").textContent=clock(remaining);document.getElementById("rest-name").textContent="Rest · "+restName;document.getElementById("rest-fill").style.width=(restTotal ? remaining/restTotal*100 : 0)+"%";bar.classList.remove("done");}
  else if(showDone){document.getElementById("rest-time").textContent="Go";document.getElementById("rest-name").textContent="Rest is over. Next set.";document.getElementById("rest-fill").style.width="100%";bar.classList.add("done");}
}
function drawSession(){var el=document.getElementById("session-clock");if(el) el.textContent=db.session ? clock((Date.now()-db.session.start)/1000) : "0:00";}
/* Runs at the display's native refresh rate; every frame is computed from real elapsed time, never stepped. */
function tick(now){
  var dt=previous==null ? 0 : Math.min(now-previous,64);previous=now;
  figures.forEach(function(f){
    if(f.paused || document.hidden || !f.visible)return;
    f.clock+=dt;f.api.frame(f.clock);
    f.slider.value=((f.clock%f.api.duration)/f.api.duration*100).toFixed(1);markStep(f);
    f.article.style.setProperty("--c",f.api.c.toFixed(2));
    if(f.follow){var loop=Math.floor(f.clock/f.api.duration);if(loop>f.loops){f.loops=loop;f.reps++;f.repEl.textContent=String(f.reps);f.counter.classList.remove("beat");void f.counter.offsetWidth;f.counter.classList.add("beat");
      if(f.reps>=f.target){f.follow=false;f.followBtn.setAttribute("aria-pressed","false");f.paused=true;f.api.frame(0);f.clock=0;f.slider.value="0";setControl(f);f.counter.classList.add("complete");
        var logs=logsFor(tk(),f.item.slug),n=1;while(n<f.item.sets && logs[n]) n++;editing[f.index]=n;render();var ed=root.querySelector('[data-editor="'+f.index+'"]');if(ed){ed.querySelector('[data-field="r"]').value=f.target;}toast("Set done: "+f.target+" reps. Log it below.");}}}
  });
  requestAnimationFrame(tick);
}
render();requestAnimationFrame(tick);setInterval(function(){drawRest();drawSession();},250);
})();
