<style>

<main id="main">
<h1>Leave a review</h1>
<p class="lead">How has training with Kenny gone? Approved reviews show on the site with your name, Instagram photo and @handle.</p>
<div id="gate"><p class="lead">Checking your membership&hellip;</p></div>
</main></div>
<script>
(function(){
  var gate=document.getElementById("gate"),q=new URLSearchParams(location.search),invite=q.get("invite")||"";
  function locked(){gate.innerHTML='<div class="box"><h2>Reviews are for members</h2><p>Only people in the Training Club can leave a review, so every review on the site is real. Log in to your plan on this phone, then come back here.</p><div class="tm-actions" style="display:flex;flex-wrap:wrap;gap:10px"><a class="send" style="display:inline-flex;align-items:center;text-decoration:none" href="site-members.html">Log in to my plan</a><a class="tm-btn line" style="display:inline-flex;align-items:center;min-height:54px;padding:0 22px;border:1px solid rgba(220,235,224,.45);border-radius:999px;color:var(--text);text-decoration:none;font-weight:700" href="site-home.html#training-paths">Join the club</a></div></div>';}
  function form(me){
    var label={member:"Verified member",tester:"Club member",invited:"Invited by Kenny"}[me.kind]||"Member";
    gate.innerHTML='<span class="who">&#10003; '+label+'</span><form id="f" novalidate>'
     +'<label for="name">Your name<input id="name" name="name" autocomplete="name" maxlength="40" required placeholder="First and last name"></label>'
     +'<label for="ig">Instagram handle <span class="hint">Your Instagram profile photo shows next to your review automatically, and tapping your name opens your profile</span><span class="ig"><span aria-hidden="true">@</span><input id="ig" name="ig" autocapitalize="none" autocomplete="off" spellcheck="false" maxlength="31" required placeholder="yourhandle"></span></label>'
          +'<div><div style="font-weight:600;font-size:.95rem;margin-bottom:6px">Your rating</div><div class="rate" role="radiogroup" aria-label="Rating" id="rate"></div></div>'
     +'<label for="msg">Your review<textarea id="msg" name="msg" maxlength="500" required placeholder="What changed for you? Strength, consistency, how the workouts feel..."></textarea><span class="count" id="count">0 / 500</span></label>'
     +'<div class="hp" aria-hidden="true"><label for="website">Website<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>'
     +'<button class="send" id="send" type="submit">Send review</button><p class="msg" id="out" role="status" aria-live="polite"></p></form>'
     +'<p class="fine">Kenny reads every review before it goes up. Please keep links out of it. Write your honest opinion, and if Kenny gave you anything for free, say so in the review. Your name, photo and @handle show publicly with your review.</p>';
    var f=document.getElementById("f"),out=document.getElementById("out"),btn=document.getElementById("send"),msg=document.getElementById("msg"),stars=5,rate=document.getElementById("rate");
    function drawRate(){rate.innerHTML=[1,2,3,4,5].map(function(n){return '<button type="button" role="radio" aria-checked="'+(n===stars)+'" aria-label="'+n+' star'+(n>1?"s":"")+'" class="'+(n<=stars?"on":"")+'" data-n="'+n+'">\u2605</button>'}).join("")}
    drawRate();rate.addEventListener("click",function(e){var b=e.target.closest("button");if(b){stars=+b.getAttribute("data-n");drawRate();}});
    msg.addEventListener("input",function(){document.getElementById("count").textContent=msg.value.length+" / 500"});
    f.addEventListener("submit",function(e){
      e.preventDefault();out.className="msg";out.textContent="";
      var d={name:f.name.value.trim(),ig:f.ig.value.trim(),msg:msg.value.trim(),stars:stars,program:me.program||"",website:f.website.value,invite:invite};
      if(d.name.length<2){out.className="msg err";out.textContent="Add your name.";f.name.focus();return;}
      if(!/^@?[A-Za-z0-9._]{1,30}$/.test(d.ig)){out.className="msg err";out.textContent="Add your Instagram handle, like @yourname.";f.ig.focus();return;}
      if(d.msg.length<8){out.className="msg err";out.textContent="Write a sentence or two about the program.";msg.focus();return;}
      btn.disabled=true;btn.textContent="Sending\u2026";
      fetch("/api/testimonials",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(r){
        if(r&&r.ok){var first=d.name.split(/\s+/)[0].replace(/[<>&"]/g,"");document.getElementById("main").innerHTML='<div class="box"><h2>Thanks, '+first+'</h2><p>Kenny got your review. Once he approves it, it shows on the site with your photo and @handle, linked to your Instagram.</p><a href="site-reviews.html" style="color:var(--text)">See member reviews</a></div>';window.scrollTo(0,0);}
        else{out.className="msg err";out.textContent=(r&&r.error)||"That didn\u2019t go through. Try again.";btn.disabled=false;btn.textContent="Send review";}
      }).catch(function(){out.className="msg err";out.textContent="No connection. Check your signal and try again.";btn.disabled=false;btn.textContent="Send review";});
    });
  }
  fetch("/api/testimonials?me=1"+(invite?"&invite="+encodeURIComponent(invite):""),{credentials:"same-origin"}).then(function(r){return r.json()}).then(function(me){if(me&&me.eligible)form(me);else locked();}).catch(locked);
})();
</script>
