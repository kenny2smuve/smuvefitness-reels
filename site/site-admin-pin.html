<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>SMUVE admin</title><style>:root{color-scheme:dark}body{margin:0;background:#050605;color:#eef3f0;font:16px/1.5 Archivo,"Helvetica Neue",Arial,sans-serif;padding:20px 16px 56px}main{max-width:760px;margin:0 auto}h1{font-size:30px;line-height:1.05;margin:0 0 4px}h2{font-size:21px;margin:34px 0 6px;scroll-margin-top:70px}h3{font-size:16px;margin:18px 0 6px}p{color:#a9b8b0;margin:0 0 10px}a{color:#9fe0b8}
.card{background:#0d1210;border:1px solid #232c28;border-radius:16px;padding:14px 16px;margin:10px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #2f3a35;background:#0a0f0d;color:#fff;font:inherit;margin:6px 0 10px}
button,.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:11px 16px;font:800 14.5px Archivo,Arial,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}.m{background:#5fb1ff;color:#06213f}.w{background:#f28db5;color:#2b0d1c}.g{background:#cfe8dc;color:#0c1110}.s{background:#1b221f;color:#eef3f0;padding:7px 12px;font-size:13px}.d{background:#3a1d1d;color:#ffb4a8;padding:7px 12px;font-size:13px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #9fe0b8;outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 180px}.code{font:800 24px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.05em;text-align:center;padding:14px;background:#000;border:1px dashed #3a4a42;border-radius:12px;margin:10px 0;user-select:all}
.link{font:13px ui-monospace,Menlo,monospace;word-break:break-all;color:#cfe8dc;background:#000;border-radius:10px;padding:10px;margin:6px 0 4px;user-select:all}.bad{color:#ff9b8a}.ok{color:#9fe0b8}.pend{color:#e9c46a}.mute{color:#8a9a92}small{color:#7f948a}
.pr{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border-top:1px solid #1d2622;padding:10px 0}.pr:first-child{border-top:0}.pr .pi{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}.pr .pa{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pr .pa form{display:flex;gap:6px;flex-wrap:wrap;margin:0;align-items:center}.mono{font:13px ui-monospace,Menlo,monospace}
.rv{border-top:1px solid #1d2622;padding:12px 0}.rv:first-child{border-top:0}.rv q{display:block;color:#eef3f0;margin:4px 0 8px;quotes:"\201C" "\201D"}.rv .st{color:#e9c46a;letter-spacing:1px}.rv .acts{display:flex;gap:6px;flex-wrap:wrap}.rv form{display:inline}
.jump{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:6px 0 0;background:linear-gradient(#050605 80%,rgba(5,6,5,0));scrollbar-width:none}.jump::-webkit-scrollbar{display:none}.jump a{flex:none;padding:7px 12px;border-radius:999px;background:#121a17;border:1px solid #26312c;color:#eef3f0;text-decoration:none;font-size:13px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 4px}@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}.tile{background:#0d1210;border:1px solid #232c28;border-radius:14px;padding:12px;text-decoration:none;color:inherit}.tile b{display:block;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}.tile span{display:block;margin-top:6px;font-size:12.5px;color:#a9b8b0;font-weight:700}
.per{border-top:1px solid #1d2622;padding:12px 0}.per:first-child{border-top:0}.per summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:start}.per summary::-webkit-details-marker{display:none}.per .nm{font-weight:800;overflow-wrap:anywhere}.per .em{font-size:13px;color:#8a9a92;overflow-wrap:anywhere}.per .rt{text-align:right;font-size:13px;white-space:nowrap}.per .ln{grid-column:1/-1;font-size:13px;color:#a9b8b0}.per[open] summary{margin-bottom:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#16201c;border:1px solid #26312c}.badge.ok{border-color:#2e5a44}.badge.pend{border-color:#5a4a20}.badge.bad{border-color:#5a2e2e}.pl-men{color:#5fb1ff}.pl-women{color:#f28db5}
.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.inline input,.inline select{width:auto;flex:1 1 160px;margin:0;padding:9px 10px}.inline button{flex:none}
.fb{border-top:1px solid #1d2622;padding:12px 0}.fb:first-child{border-top:0}.fb .msg{white-space:pre-wrap;color:#eef3f0;margin:6px 0 8px;overflow-wrap:anywhere}.fb.done{opacity:.6}
.sys{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;border-top:1px solid #1d2622;padding:10px 0}.sys:first-child{border-top:0}.sys .what b{display:block}.sys .what small{display:block}
.search{position:relative}.search input{padding-left:12px}.flash{border-color:#2e5a44}.warnc{border-color:#5a4a20}</style></head><body><main><div style="background:#e9c46a;color:#151100;font:700 13px Arial;padding:8px 12px;border-radius:10px;margin:0 0 14px">Preview with sample data. Buttons are off here; on the live site this page needs your three passwords.</div><h1>Admin</h1><p>Step 2 of 3: your second password.</p><form class="card" method="post" action="/admin/step2"><label>Second password<input name="pw2" type="password" autocomplete="off" required autofocus></label><button class="g" type="submit">Continue</button></form><p><small><a href="/admin/logout" style="color:#7f948a">Start over</a></small></p></main><script>document.addEventListener("submit",function(e){var f=e.target;if((f.getAttribute("method")||"get").toLowerCase()==="get")return;e.preventDefault();e.stopImmediatePropagation();},true)</script></body></html>
