/* ---- site header: a copy of the homepage header. Values are the homepage's computed styles (app/globals.css .site-header /

.intro{padding:24px 0 20px}.intro p{margin:0 0 6px;color:var(--muted);font-size:12.5px}

.exercises{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.exercise{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;box-shadow:0 18px 40px -28px rgba(0,0,0,.9)}

.stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:9%;background:linear-gradient(180deg,rgba(0,0,0,0),var(--floor));pointer-events:none}
.stage>svg{position:relative;z-index:1;width:100%;height:100%;display:block}
.motion-bar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface-2)}
.icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
.motion-bar input{width:100%;min-width:0;height:44px;accent-color:var(--flame)}

.rep-steps li.on{background:var(--flame-soft);color:var(--text)}

.rep-steps li.on .n{background:var(--flame);border-color:var(--flame);color:var(--done-ink)}

.set.done{background:var(--done);border-color:var(--done);color:var(--done-ink)}.set.done .set-v{color:var(--done-ink)}.set.editing{border-color:var(--flame);box-shadow:0 0 0 2px var(--flame-soft)}

.rep-counter[hidden]{display:none}.rep-counter strong{font:800 30px/1 var(--mono);color:var(--flame)}.rep-label{font-size:11px;color:var(--text-2);text-transform:uppercase}.rep-of{font:600 14px var(--mono);color:var(--text-2)}

15","rest":"60 sec","restSeconds":60},{"slug":"home-row","sets":3,"reps":"10–20","rest":"60 sec","restSeconds":60},{"slug":"home-heel-squat","sets":3,"reps":"8–15","rest":"60 sec","restSeconds":60},{"slug":"home-curl","sets":3,"reps":"10–20","rest":"60 sec","restSeconds":60},{"slug":"home-crunch","sets":3,"reps":"10–15","rest":"60 sec","restSeconds":60}]},"women-home":{"title":"At-home lower body + core","exercises":[{"slug":"home-bridge","sets":3,"reps":"12–20","rest":"60 sec","restSeconds":60},{"slug":"home-wide","sets":3,"reps":"12–20","rest":"60 sec","restSeconds":60},{"slug":"home-single-hinge","sets":3,"reps":"8–12 each","rest":"60 sec","restSeconds":60},{"slug":"home-band-side","sets":3,"reps":"8–12 each way","rest":"60 sec","restSeconds":60},{"slug":"home-deadbug","sets":3,"reps":"6–10 each","rest":"60 sec","restSeconds":60}]}},"library":{"back-squat":{"n":"Back squat","m":"Quads · Glutes · Core","p":"squat","hl":"quads","s":"Bar across your upper back, not your neck. Feet shoulder width, toes turned out slightly, big breath into the belly.","x":"Push your hips back and bend the knees together until your thighs pass parallel, keeping your chest up, then drive through your whole foot to stand.","b":"Big breath in at the top, hold through the bottom, exhale as you pass the sticking point.","t":"3 seconds down · drive up","q":"Keep your whole foot planted and let your knees follow your toes.","w":"Letting the chest fall forward out of the hole. If it happens, the weight is telling you something."},"single-arm-pulldown":{"n":"Single-arm lat pulldown","m":"Lats · Mid back","p":"pulldown","hl":"back","s":"One handle on a high pulley, kneel or sit tall, working side slightly away from the stack.","x":"Let the arm reach up and long, then drive the elbow down toward your hip pocket, squeezing the lat at the bottom.","b":"Out as you pull. In on the stretch.","t":"1 second down · 3 seconds up","c":"Chase the stretch at the top. One arm at a time lets you get range you cannot get with a bar.","w":"Twisting your whole torso to finish the rep. Keep the chest square.","a":"Wide-grip lat pulldown","q":"Chase the stretch at the top. One arm at a time lets you get range you cannot get with a bar."},"dip":{"n":"Dips","m":"Triceps · Lower chest","p":"dip","hl":"tris","s":"Grip the parallel bars, arms straight, shoulders down, a slight forward lean with the knees bent.","x":"Lower until your upper arms are about parallel to the floor, elbows pointing back, then press back up to straight arms.","b":"In as you lower. Out as you press.","t":"2 seconds down · 1 second up","q":"Shoulders down and away from your ears. Use only a comfortable shoulder range.","w":"Going so deep your shoulders roll forward. Parallel is plenty."},"walking-lunge":{"n":"Walking lunge","m":"Quads · Glutes · Balance","p":"lunge","hl":"glutes","s":"Dumbbells at your sides, tall posture, clear path in front of you.","x":"Step forward into a lunge until the back knee is an inch off the floor, then drive through the front heel and step straight into the next rep.","b":"In as you descend. Out as you drive up.","t":"controlled down · strong up","c":"Long steps for glutes, shorter steps for quads. Torso stays vertical either way.","w":"Letting the front knee cave inward. Push the knee out over your second toe.","a":"Reverse lunge or split squat","q":"Long steps for glutes, shorter steps for quads. Torso stays vertical either way."},"db-curl":{"n":"Dumbbell curl","m":"Biceps · Forearms","p":"curl","hl":"bis","s":"Stand tall with a bell in each hand, palms forward, elbows pinned to your ribs and your shoulders pulled back.","x":"Curl one bell up until the forearm is just past vertical, squeeze hard at the top, then take two full seconds lowering it all the way to a straight arm before the other arm moves.","b":"Out on the curl. In on the lower.","t":"1 second up · 2 seconds down","c":"The elbow does not travel. If it drifts forward to finish the rep, the front delt just did your curl for you.","w":"Swinging the hips or leaning back to start the rep. Lighter bells, cleaner reps.","a":"EZ-bar curl or seated dumbbell curl","q":"The elbow does not travel. If it drifts forward to finish the rep, the front delt just did your curl for you."},"oh-cable-tri-ext":{"n":"Overhead cable triceps extension","m":"Triceps, long head","p":"triext","hl":"tris","s":"Rope on a high-to-mid pulley. Face away, rope behind your head, one foot forward, torso leaning slightly in.","x":"Keep your elbows pointing forward and locked in place. Straighten your arms out in front of you, then let your hands travel back behind your head for a deep stretch.","b":"Out as you extend. In as your hands come back.","t":"2 seconds back · 1 second out","q":"Keep your upper arms steady. Let the elbows do the bending.","w":"Elbows drifting wide and forward, turning it into a press."},"bulgarian-split-squat":{"n":"Bulgarian split squat","m":"Quads · Glutes","p":"split","hl":"glutes","s":"Back foot laces-down on a bench, front foot about two feet forward, torso tall.","x":"Drop straight down until the back knee is just off the floor and the front thigh is parallel, then drive through the front heel to stand.","b":"In as you lower. Out as you drive up.","t":"3 seconds down · 1 second up","q":"Keep the front heel down. Let the rear leg assist with balance.","w":"Bouncing off the bottom. Pause a beat and own it."},"goblet-squat":{"n":"Goblet squat","m":"Quads · Glutes · Core","p":"squat-goblet","hl":"quads","s":"Hold one dumbbell vertically at your chest, elbows tucked underneath, feet shoulder width.","x":"Sit straight down between your heels until your elbows touch the inside of your knees, then stand tall and squeeze the glutes.","b":"In on the way down. Out as you stand.","t":"3 seconds down · 1 second up","c":"The weight in front is a counterbalance. It lets you sit deeper and stay upright, so use the range.","w":"Heels lifting off the floor. Widen the stance or turn the toes out more.","a":"Back squat or leg press","q":"The weight in front is a counterbalance. It lets you sit deeper and stay upright, so use the range."},"hip-thrust":{"n":"Barbell hip thrust","m":"Glutes · Hamstrings","p":"hipthrust","hl":"glutes","s":"Upper back on a bench at shoulder-blade height, bar over the hips with a pad, feet flat and shin vertical at the top.","x":"Drive the hips up until your body makes a straight line from knee to shoulder, squeeze the glutes hard, then lower under control.","b":"Out as you drive up. In as you lower.","t":"1 second up · 1 second hold · 3 seconds down","q":"Keep your upper back supported. Finish with ribs down and shins near vertical.","w":"Pushing through the toes. Drive through the heels."},"cable-kickback":{"n":"Cable glute kickback","m":"Glutes","p":"kickback","hl":"glutes","s":"Ankle strap on a low pulley, facing the stack. Hold an upright, hinge forward slightly, standing leg softly bent.","x":"Drive the working leg straight back and slightly up until the glute is fully squeezed, keeping the knee nearly straight, then return under control without letting the stack rest.","b":"Out as you drive back. In on the return.","t":"1 second back · 1 second squeeze · 3 seconds return","w":"Swinging the leg and letting the torso rock. Lock the torso still and move only at the hip.","q":"Hips square to the stack, knee almost straight, squeeze at the top."},"kickstand-db-rdl":{"n":"Kickstand dumbbell Romanian deadlift","m":"Hamstrings · Glutes","p":"hinge","hl":"hams","hl2":"glutes","s":"Dumbbells in both hands. Put one foot back so only the toe is down, heel up, taking about a fifth of your weight. The front leg does the work.","x":"Push the front hip straight back and let the bells travel down the front of the working leg until the hamstring is loaded, then drive the hip forward to stand tall.","b":"In as you hinge back. Out as you stand.","t":"4 seconds down · 1 second up","c":"The back foot is a kickstand, not a second leg. It is there for balance only, so resist the urge to push off it.","w":"Splitting the weight evenly between both feet. That turns it back into a regular RDL and you lose the point.","a":"Dumbbell RDL on both legs, or seated leg curl","q":"The back foot is a kickstand, not a second leg. It is there for balance only, so resist the urge to push off it."},"supported-low-step-down":{"n":"Supported low step-down","m":"Quads · Glutes · Control","p":"stepdown","hl":"quads","hl2":"glutes","s":"Stand on a low box, four to eight inches, with one foot at the edge. One hand on an upright or rail for balance only.","x":"Bend the standing knee and lower the free foot slowly until the heel taps the floor, then drive back up through the standing leg without pushing off the floor.","b":"In on the way down. Out as you stand.","t":"4 seconds down · 1 second up","c":"The rail is for balance, not for lifting you. If you are pulling on it, the box is too tall — drop the height.","w":"Dropping fast and bouncing off the floor. The slow lowering is the whole exercise.","a":"Bulgarian split squat or step-up","q":"The rail is for balance, not for lifting you. If you are pulling on it, the box is too tall — drop the height."},"sumo-db-squat":{"n":"Sumo dumbbell squat","m":"Quads · Glutes · Adductors","p":"squat-goblet","hl":"quads","hl2":"adduct","s":"Feet wider than shoulders, toes turned out about thirty degrees, one dumbbell held with both hands in front of your hips.","x":"Sit straight down between your heels keeping the chest tall, go as deep as your hips allow with a flat back, then drive up and squeeze the glutes at the top.","b":"In on the way down. Out as you stand.","t":"3 seconds down · 1 second up","c":"Push your knees out over your toes the whole way down. The wide stance only works if the knees track with the feet.","w":"Letting the knees collapse inward out of the bottom. Widen the stance or lighten the bell.","a":"Goblet squat or leg press with a wide foot position","q":"Push your knees out over your toes the whole way down. The wide stance only works if the knees track with the feet."},"home-floor-press":{"id":"floor-press","n":"Band floor press","m":"Chest · Triceps · Front delts","p":"push","equipment":"Intact resistance band with handles; inspect before each set. Any anchor must be manufacturer-rated and installed as directed, never improvised furniture. Pass a flat band across your upper back, below the neck.","reps":"8–15","s":"Lie with bent knees, elbows on the mat and handles above elbows. Keep the band flat under your upper back. Equipment: Intact resistance band with handles; inspect before each set. Any anchor must be manufacturer-rated and installed as directed, never improvised furniture. Pass a flat band across your upper back, below the neck.","x":"Press both hands over the chest. Lower until upper arms gently meet the mat.","c":"Let the elbows touch the floor, never bounce them. The floor is your built-in range limit.","w":"Putting the band across the neck or bouncing elbows off the floor.","easier":"Use a lighter band or shorter range.","harder":"Increase tension when the last repetitions remain controlled.","transfer":"A floor-supported horizontal press. The floor limits shoulder extension compared with a bench.","b":"Out as you press. In as you lower.","t":"1 second up · 1 second hold · 2 seconds down","a":"Use a lighter band or shorter range. Progression: Increase tension when the last repetitions remain controlled.","load":"Minimal kit","family":"floor-press","steps":[["Press","Both hands over the chest"],["Lockout","Forearms stacked"],["Lower","Upper arms touch the mat softly"]],"at":null,"q":"Let the elbows touch the floor, never bounce them. The floor is your built-in range limit."},"home-row":{"id":"row","n":"Standing band row","m":"Mid-back · Lats · Biceps","p":"row","equipment":"An intact resistance band and a manufacturer-rated anchor, installed as directed. Never use a loose chair, towel over a door, or untested furniture. Set the anchor near lower-chest height.","reps":"10–20","s":"Face the anchor in a staggered stance. Begin with long arms, neutral wrists and light band tension. Equipment: An intact resistance band and a manufacturer-rated anchor, installed as directed. Never use a loose chair, towel over a door, or untested furniture. Set the anchor near lower-chest height.","x":"Pull elbows back toward your lower ribs; pause without forcing shoulders back. Reach forward slowly without rounding your spine.","c":"Stand still and let the arms do the moving. If your chest chases the band, step closer to the anchor.","w":"Rocking the torso or extending the lower back.","easier":"Move closer to reduce tension.","harder":"Step slightly farther away within the band maker's stretch limit.","transfer":"Retains horizontal pulling. The unsupported standing position and rising band resistance differ from seated/chest-supported machines.","b":"Out as you row. In as you reach.","t":"1 second back · 1 second squeeze · 3 seconds forward","a":"Move closer to reduce tension. Progression: Step slightly farther away within the band maker's stretch limit.","load":"Minimal kit","family":"row","steps":[["Row","Elbows back toward the lower ribs"],["Squeeze","Shoulder blades together"],["Reach","Arms long, no rounding"]],"at":null,"q":"Stand still and let the arms do the moving. If your chest chases the band, step closer to the anchor."},"home-heel-squat":{"id":"heel-squat","n":"Heel-supported close-stance squat","m":"Quads · Glutes","p":"squat","equipment":"A low rigid exercise wedge with a non-slip base; fixed support within reach.","reps":"8–15","s":"Place both heels on the low wedge with a comfortable narrow stance. Reach hands forward. Equipment: A low rigid exercise wedge with a non-slip base; fixed support within reach.","x":"Bend knees and hips in control, keeping whole feet supported. Stand tall.","c":"The heel support lets the knees go forward over the toes. That is what puts this squat into the quads.","w":"Balancing on loose books or lifting toes.","easier":"Squat on flat ground with a smaller range.","harder":"Increase controlled depth before difficulty.","transfer":"More forward knee travel can bias quadriceps; external load is still lower than a hack squat.","b":"In on the way down. Out as you stand.","t":"3 seconds down · 1 second up","a":"Squat on flat ground with a smaller range. Progression: Increase controlled depth before difficulty.","load":"Minimal kit","family":"heel-squat","steps":[["Lower","Knees travel forward"],["Bottom","Whole feet supported"],["Stand","Drive up tall"]],"at":null,"q":"The heel support lets the knees go forward over the toes. That is what puts this squat into the quads."},"home-curl":{"id":"curl","n":"Standing band curl","m":"Biceps · Brachialis · Forearms","p":"curl","equipment":"Intact long resistance band under both midfeet, shoes on; follow its stretch limit.","reps":"10–20","s":"Stand on the center of the band. Hold equal lengths with palms forward and elbows beside your ribs. Equipment: Intact long resistance band under both midfeet, shoes on; follow its stretch limit.","x":"Curl hands upward without moving upper arms forward. Lower for two to three seconds.","c":"Full straight arm at the bottom of every rep. Half reps make half the arm.","w":"Leaning back or trapping the band under only the tips of your toes.","easier":"Use a lighter band or less starting tension.","harder":"Increase tension gradually after reaching 20 controlled reps.","transfer":"Retains elbow flexion; unlike an incline curl, the shoulder is not extended behind the body.","b":"Out as you curl. In as you lower.","t":"1 second up · 2 seconds down","a":"Use a lighter band or less starting tension. Progression: Increase tension gradually after reaching 20 controlled reps.","load":"Minimal kit","family":"curl","steps":[["Curl","Elbows pinned to the ribs"],["Squeeze","Palms toward the shoulders"],["Lower","All the way to straight"]],"at":null,"q":"Full straight arm at the bottom of every rep. Half reps make half the arm."},"home-crunch":{"id":"crunch","n":"Controlled floor curl-up","m":"Abdominals","p":"core","equipment":"Clear, non-slip floor; optional exercise mat.","reps":"10–15","s":"Lie with knees bent, feet planted and arms long beside you, palms resting on the mat. Equipment: Clear, non-slip floor; optional exercise mat.","x":"Lift the shoulder blades gently while sliding the hands toward the heels along the mat. Lower slowly without pulling on the neck.","c":"This is a small movement. Ribs toward the hips, chin tucked, and never pull on the neck.","w":"Pulling the neck or using momentum.","easier":"Use a smaller lift or a dead bug if flexion is uncomfortable.","harder":"Pause one second at the top.","transfer":"Preserves trunk flexion but with much less external resistance than a cable crunch.","b":"Out as you curl up. In as you lower.","t":"1 second up · 1 second pause · 2 seconds down","a":"Use a smaller lift or a dead bug if flexion is uncomfortable. Progression: Pause one second at the top.","load":"Bodyweight","family":"crunch","steps":[["Curl","Shoulder blades leave the mat"],["Pause","Hands slide toward the heels"],["Lower","Slow back down"]],"at":null,"q":"This is a small movement. Ribs toward the hips, chin tucked, and never pull on the neck."},"home-bridge":{"id":"bridge","n":"Paused floor glute bridge","m":"Glutes · Hamstrings","p":"bridge","equipment":"Clear, non-slip floor; optional exercise mat.","reps":"12–20","s":"Lie on your back, feet hip width and knees bent. Arms rest beside you. Keep ribs gently down. Equipment: Clear, non-slip floor; optional exercise mat.","x":"Press through feet to raise hips until shoulders, hips and knees roughly align. Hold two seconds, then lower without arching.","c":"Ribs down and chin tucked. If you feel it in your lower back, you are arching instead of squeezing.","w":"Pushing hips higher by flaring ribs or turning feet far out.","easier":"Lift through a smaller pain-free range.","harder":"Use a longer pause, then the single-leg version.","transfer":"Retains hip extension with shorter range and less load than a bench hip thrust.","b":"Out as you drive up. In as you lower.","t":"1 second up · 2 second squeeze · 3 seconds down","a":"Lift through a smaller pain-free range. Progression: Use a longer pause, then the single-leg version.","load":"Bodyweight","family":"bridge","steps":[["Lift","Drive through the heels"],["Squeeze","Two-second glute squeeze"],["Lower","Back down with control"]],"at":null,"q":"Ribs down and chin tucked. If you feel it in your lower back, you are arching instead of squeezing."},"home-wide":{"id":"wide","n":"Wide-stance bodyweight squat","m":"Quads · Glutes · Adductors","p":"squat","equipment":"Clear, non-slip floor; optional exercise mat.","reps":"12–20","s":"Stand a little wider than shoulders with a comfortable toe angle; hands together at chest height. Equipment: Clear, non-slip floor; optional exercise mat.","x":"Sit down between your feet while knees follow toes. Pause briefly, then drive evenly through both feet.","c":"Toes turned out, knees follow them. The wide stance moves more of the work into the glutes and inner thighs.","w":"Knees collapsing inward or bouncing off the bottom.","easier":"Use a narrower stance and shallower depth.","harder":"Add a two-second bottom pause.","transfer":"Retains a wide-stance squat and adductor contribution, without a suspended dumbbell.","b":"In on the way down. Out as you stand.","t":"3 seconds down · 1 second up","a":"Use a narrower stance and shallower depth. Progression: Add a two-second bottom pause.","load":"Bodyweight","family":"wide","steps":[["Lower","Knees push out over the toes"],["Bottom","Torso tall"],["Stand","Squeeze the glutes at the top"]],"at":null,"q":"Toes turned out, knees follow them. The wide stance moves more of the work into the glutes and inner thighs."},"home-single-hinge":{"id":"single-hinge","n":"Wall-supported single-leg hinge","m":"Hamstrings · Glutes · Hip stabilizers","p":"hinge","equipment":"Non-slip floor and fixed wall for light fingertip support.","reps":"8–12 each","s":"Stand on one leg with the other foot clear of the floor; touch the wall lightly. Equipment: Non-slip floor and fixed wall for light fingertip support.","x":"Send hips backward and the free leg behind you. Stop before the pelvis rotates, then stand tall.","c":"Use the wall for balance, not support. Stop before your hips twist open.","w":"Opening the hip or reaching for maximum depth.","easier":"Keep the rear toes down as a kickstand.","harder":"Use less wall support, then a light secure load.","transfer":"A true single-leg hinge increases balance demand versus a kickstand hinge; it still cannot equal a heavy RDL.","b":"In as you hinge. Out as you stand.","t":"3 seconds down · 1 second up","a":"Keep the rear toes down as a kickstand. Progression: Use less wall support, then a light secure load.","load":"Minimal kit","family":"single-hinge","steps":[["Hinge","Hips back, free leg back"],["Stretch","Hips face the floor"],["Stand","Squeeze the standing glute"]],"at":null,"q":"Use the wall for balance, not support. Stop before your hips twist open."},"home-band-side":{"id":"band-side","n":"Mini-band side step","m":"Glute medius · Glutes · Quads","p":"abduction","equipment":"Intact mini-band above knees; clear space for one step each way.","reps":"8–12 each way","s":"Use a small knee and hip bend with feet hip width and light band tension. Equipment: Intact mini-band above knees; clear space for one step each way.","x":"Step one foot sideways then follow without letting feet meet. Reverse direction after a few steps.","c":"Keep tension on the band the entire set. If the feet come together, you lost the exercise.","w":"Dragging feet together or using a band that changes knee alignment.","easier":"No band and smaller steps.","harder":"Slightly stronger band without crouching deeper.","transfer":"Weight-bearing hip abduction /* one click handler for every control in the sample */
root.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b||!root.contains(b))return;
  var track=SAMPLE.tracks[tk()];
  if(b.hasAttribute("data-theme-set")){try{localStorage.setItem("smuve.theme",b.getAttribute("data-theme-set"));}catch(e){}(window.smvFade||function(f){f();})(applyTheme);return;}
  if(b.hasAttribute("data-place")){place=b.getAttribute("data-place")==="home" ? "home" : "gym";restEnd=0;editing={};try{localStorage.setItem("smuve.place",place);var u2=new URL(location.href);if(place==="home")u2.searchParams.set("place","home");else u2.searchParams.delete("place");history.replaceState(null,"",u2.href);}catch(e){}render();var ps=root.querySelector(".places");if(ps)ps.scrollIntoView({block:"start",behavior:reduce ? "auto" : "smooth"});return;}
  if(b.hasAttribute("data-program")){program=b.getAttribute("data-program");restEnd=0;editing={};try{var url=new URL(location.href);url.searchParams.set("program",program);history.replaceState(null,"",url.href);}catch(e){}render();window.scrollTo(0,0);return;}
  if(b.hasAttribute("data-unit")){convertUnit(b.getAttribute("data-unit"));return;}
  if(b.hasAttribute("data-finish")){finishSession(false);return;}
  if(b.hasAttribute("data-play")){var f=figures[+b.getAttribute("data-play")];f.paused=!f.paused;setControl(f);return;}
  if(b.hasAttribute("data-follow")){var g=figures[+b.getAttribute("data-follow")];startFollow(g,!g.follow);return;}
  if(b.hasAttribute("data-set")){var i=+b.getAttribute("data-index"),n=+b.getAttribute("data-set");editing[i]=editing[i]===n ? null : n;render();var ed=root.querySelector('[data-editor="'+i+'"]');if(ed){ed.scrollIntoView({block:"nearest",behavior:reduce ? "auto" : "smooth"});var first=ed.querySelector('[data-field="w"]');if(first)first.focus({preventScroll:true});}return;}
  var editor=b.closest(".set-editor");
  if(editor){
    var idx=+editor.getAttribute("data-editor"),item=track.exercises[idx],n2=editing[idx];
    if(b.hasAttribute("data-step")){var inp=editor.querySelector('[data-field="'+b.getAttribute("data-step")+'"]'),v=Math.max(0,(+inp.value||0)+(+b.getAttribute("data-d")));inp.value=b.getAttribute("data-step")==="r" ? Math.round(v) : Math.round(v*2)/2;return;}
    if(b.hasAttribute("data-rpe")){editor.querySelectorAll("[data-rpe]").forEach(function(x){x.setAttribute("aria-pressed",String(x===b && x.getAttribute("aria-pressed")!=="true"));});return;}
    if(b.hasAttribute("data-clear")){setLog(tk(),item.slug,n2,null);editing[idx]=null;persist();render();return;}
    if(b.hasAttribute("data-log")){
      var w=Math.max(0,+editor.querySelector('[data-field="w"]').value||0),r=Math.max(0,Math.round(+editor.querySelector('[data-field="r"]').value||0)),rpe=editor.querySelector('[data-rpe][aria-pressed="true"]'),existing=logsFor(tk(),item.slug)[n2];
      if(!r){toast("Enter how many reps you did.");return;}
      setLog(tk(),item.slug,n2,{w:w,r:r,e:rpe ? rpe.getAttribute("data-rpe") : "",t:Date.now()});
      if(!db.session) db.session={program:tk(),start:Date.now()};
      var key=tk()+"|"+item.slug,best=db.best[key],isBest=w>0 && (!best || w*r>best.vol || w>best.w);
      if(isBest) db.best[key]={w:w,r:r,vol:w*r,t:Date.now()};
      persist();
      var next=n2<item.sets ? n2+1 : null;editing[idx]=null;
      if(!existing){restTotal=item.restSeconds;restEnd=Date.now()+restTotal*1000;restName=LIB[item.slug].n+(next ? " · set "+next+" next" : " · all sets done");}
      render();
      toast(isBest ? "New best on "+LIB[item.slug].n+": "+(w ? fmtW(w)+" × " : "")+r : "Set "+n2+" logged"+(next ? ". Rest, then set "+next+"." : ". "+LIB[item.slug].n+" complete."));
      return;
    }
  }
  if(b.id==="skip-rest"){restEnd=0;restDoneUntil=0;drawRest();return;}
  if(b.id==="add-rest"){if(restEnd){restEnd+=30000;restTotal+=30;drawRest();}return;}
});

function startFollow(f,on){
  f.follow=on;f.followBtn.setAttribute("aria-pressed",String(on));f.counter.hidden=!on;
  if(on){f.reps=0;f.loops=0;f.clock=0;f.paused=false;f.repEl.textContent="0";f.counter.classList.remove("complete");setControl(f);}
}
function markStep(f){if(f.step===f.api.step)return;f.step=f.api.step;for(var k=0;k<f.items.length;k++){var on=k===f.step;f.items[k].className=on?"on":"";if(on)f.items[k].setAttribute("aria-current","step");else f.items[k].removeAttribute("aria-current");}}
function setControl(f){f.button.innerHTML=icon(f.paused ? "play" : "pause");f.button.setAttribute("aria-label",(f.paused ? "Play " : "Pause ")+f.name);f.button.title=f.paused ? "Play movement" : "Pause movement";}
function drawRest(){
  var bar=document.getElementById("sample-rest");if(!bar)return;
  var remaining=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
  if(restEnd && !remaining){restEnd=0;restDoneUntil=Date.now()+6000;}
  var showDone=restDoneUntil>Date.now();
  bar.hidden=!remaining && !showDone;
  if(remaining){document.getElementById("rest-time").textContent=clock(remaining);document.getElementById("rest-name").textContent="Rest · "+restName;document.getElementById("rest-fill").style.width=(restTotal ? remaining/restTotal*100 : 0)+"%";bar.classList.remove("done");}
  else if(showDone){document.getElementById("rest-time").textContent="Go";document.getElementById("rest-name").textContent="Rest is over. Next set.";document.getElementById("rest-fill").style.width="100%";bar.classList.add("done");}
}
function drawSession(){var el=document.getElementById("session-clock");if(el) el.textContent=db.session ? clock((Date.now()-db.session.start)/1000) : "0:00";}
/* Runs at the display's native refresh rate; every frame is computed from real elapsed time, never stepped. */
function tick(now){
  var dt=previous==null ? 0 : Math.min(now-previous,64);previous=now;
  figures.forEach(function(f){
    if(f.paused || document.hidden || !f.visible)return;
    f.clock+=dt;f.api.frame(f.clock);
    f.slider.value=((f.clock%f.api.duration)/f.api.duration*100).toFixed(1);markStep(f);
    f.article.style.setProperty("--c",f.api.c.toFixed(2));
    if(f.follow){var loop=Math.floor(f.clock/f.api.duration);if(loop>f.loops){f.loops=loop;f.reps++;f.repEl.textContent=String(f.reps);f.counter.classList.remove("beat");void f.counter.offsetWidth;f.counter.classList.add("beat");
      if(f.reps>=f.target){f.follow=false;f.followBtn.setAttribute("aria-pressed","false");f.paused=true;f.api.frame(0);f.clock=0;f.slider.value="0";setControl(f);f.counter.classList.add("complete");
        var logs=logsFor(tk(),f.item.slug),n=1;while(n<f.item.sets && logs[n]) n++;editing[f.index]=n;render();var ed=root.querySelector('[data-editor="'+f.index+'"]');if(ed){ed.querySelector('[data-field="r"]').value=f.target;}toast("Set done: "+f.target+" reps. Log it below.");}}}
  });
  requestAnimationFrame(tick);
}
render();window.__samplePreview={data:SAMPLE,rig:Figure};requestAnimationFrame(tick);setInterval(function(){drawRest();drawSession();},250);
})();
